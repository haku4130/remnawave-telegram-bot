name: remnawave-bot

services:
  postgres:
    image: postgres:15-alpine
    container_name: remnawave_bot_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-remnawave_bot}
      POSTGRES_USER: ${POSTGRES_USER:-remnawave_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password_123}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-remnawave_user} -d ${POSTGRES_DB:-remnawave_bot}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - bot_network

  redis:
    image: redis:7-alpine
    container_name: remnawave_bot_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 10s
      retries: 3
    networks:
      - bot_network

  bot:
    image: haku4130/remnawave-telegram-bot:latest
    container_name: remnawave_bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      FORCE_COLOR: '1'
      DOCKER_ENV: 'true'
      DATABASE_MODE: 'auto'
      POSTGRES_HOST: 'postgres'
      POSTGRES_PORT: '5432'
      POSTGRES_DB: '${POSTGRES_DB:-remnawave_bot}'
      POSTGRES_USER: '${POSTGRES_USER:-remnawave_user}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:-secure_password_123}'

      REDIS_URL: 'redis://redis:6379/0'

      TZ: 'Europe/Moscow'
      LOCALES_PATH: '${LOCALES_PATH:-/app/locales}'
    volumes:
      # Логи
      - ./logs:/app/logs:rw
      # Данные приложения (для SQLite в случае переключения)
      - ./data:/app/data:rw
      - ./locales:/app/locales:rw
      # Timezone
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      # Загруженные медиафайлы (изображения/видео для новостей)
      - ./uploads:/app/uploads:rw
      # Логотип для сообщений
      - ./vpn_logo.png:/app/vpn_logo.png:ro
    networks:
      - bot_network
      - traefik-public
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.services.remnawave-bot.loadbalancer.server.port=${WEB_API_PORT:?}
      - traefik.http.middlewares.remnawave-bot-api-strip.stripprefix.prefixes=/api
      - traefik.http.routers.remnawave-bot-api-http.entrypoints=http
      - traefik.http.routers.remnawave-bot-api-http.rule=Host(`cabinet.zanity.net`) && PathPrefix(`/api`)
      - traefik.http.routers.remnawave-bot-api-http.priority=100
      - traefik.http.routers.remnawave-bot-api-http.middlewares=https-redirect,remnawave-bot-api-strip
      - traefik.http.routers.remnawave-bot-api-https.entrypoints=https
      - traefik.http.routers.remnawave-bot-api-https.rule=Host(`cabinet.zanity.net`) && PathPrefix(`/api`)
      - traefik.http.routers.remnawave-bot-api-https.priority=100
      - traefik.http.routers.remnawave-bot-api-https.tls=true
      - traefik.http.routers.remnawave-bot-api-https.tls.certresolver=le
      - traefik.http.routers.remnawave-bot-api-https.middlewares=remnawave-bot-api-strip
      - traefik.http.routers.remnawave-bot-api-https.service=remnawave-bot
      - traefik.http.routers.remnawave-bot-webhook-http.entrypoints=http
      - traefik.http.routers.remnawave-bot-webhook-http.rule=Host(`bot.zanity.net`)
      - traefik.http.routers.remnawave-bot-webhook-http.middlewares=https-redirect
      - traefik.http.routers.remnawave-bot-webhook-http.service=remnawave-bot
      - traefik.http.routers.remnawave-bot-webhook-https.entrypoints=https
      - traefik.http.routers.remnawave-bot-webhook-https.rule=Host(`bot.zanity.net`)
      - traefik.http.routers.remnawave-bot-webhook-https.tls=true
      - traefik.http.routers.remnawave-bot-webhook-https.tls.certresolver=le
      - traefik.http.routers.remnawave-bot-webhook-https.service=remnawave-bot
    ports:
      - '${WEB_API_PORT:?}:${WEB_API_PORT:?}'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import requests, os; requests.get(''http://localhost:${WEB_API_PORT:?}/health'', headers={''X-API-Key'': os.environ.get(''WEB_API_DEFAULT_TOKEN'')}, timeout=5) or exit(1)"',
        ]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 10s

  cabinet-frontend:
    image: ghcr.io/bedolaga-dev/bedolaga-cabinet:latest
    container_name: cabinet_frontend
    restart: unless-stopped
    networks:
      - bot_network
      - traefik-public
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.services.cabinet-frontend.loadbalancer.server.port=80
      - traefik.http.routers.cabinet-frontend-http.entrypoints=http
      - traefik.http.routers.cabinet-frontend-http.rule=Host(`cabinet.zanity.net`)
      - traefik.http.routers.cabinet-frontend-http.priority=10
      - traefik.http.routers.cabinet-frontend-http.middlewares=https-redirect
      - traefik.http.routers.cabinet-frontend-https.entrypoints=https
      - traefik.http.routers.cabinet-frontend-https.rule=Host(`cabinet.zanity.net`)
      - traefik.http.routers.cabinet-frontend-https.priority=10
      - traefik.http.routers.cabinet-frontend-https.tls=true
      - traefik.http.routers.cabinet-frontend-https.tls.certresolver=le
      - traefik.http.routers.cabinet-frontend-https.service=cabinet-frontend
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-verbose --tries=1 --spider http://127.0.0.1:80/ || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  routing-updater:
    image: ghcr.io/lifeindarkside/remnawave-routing-update:latest
    container_name: remna-routing-updater
    restart: unless-stopped
    environment:
      - REMNA_BASE_URL=${REMNAWAVE_API_URL}/api
      - REMNA_TOKEN=$REMNAWAVE_API_KEY
    networks:
      - bot_network

  xray-checker:
    image: kutovoys/xray-checker
    environment:
      - SUBSCRIPTION_URL=${SUBSCRIPTION_URL}#ZanityVPN
      - WEB_PUBLIC=true
      - METRICS_PROTECTED=true
      - METRICS_USERNAME=${XRAY_CHECKER_METRICS_USERNAME}
      - METRICS_PASSWORD=${XRAY_CHECKER_METRICS_PASSWORD}
    networks:
      - bot_network
      - traefik-public
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.services.xray-checker.loadbalancer.server.port=2112
      - traefik.http.routers.xray-checker-http.entrypoints=http
      - traefik.http.routers.xray-checker-http.rule=Host(`status.zanity.net`)
      - traefik.http.routers.xray-checker-http.middlewares=https-redirect
      - traefik.http.routers.xray-checker-https.entrypoints=https
      - traefik.http.routers.xray-checker-https.rule=Host(`status.zanity.net`)
      - traefik.http.routers.xray-checker-https.tls=true
      - traefik.http.routers.xray-checker-https.tls.certresolver=le
      - traefik.http.routers.xray-checker-https.service=xray-checker

volumes:
  postgres_data:
  redis_data:

networks:
  bot_network:
  traefik-public:
    external: true
